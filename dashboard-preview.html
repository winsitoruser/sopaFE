<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sobatpaws</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard-preview.css?v=full2">
</head>
<body>
<div class="app" id="app" data-collapsed="false" data-nav="false">
  <aside class="side" aria-label="Menu utama">
    <a class="brand" href="#dashboard" data-go="dashboard" aria-label="Sobat Paws">
      <img src="assets/img/sobat-paws-logo.png" alt="Sobat Paws" width="120" height="96">
    </a>
    <div class="side-scroll" id="nav"></div>
  </aside>
  <button class="scrim" type="button" data-close-nav aria-label="Tutup menu"></button>

  <div class="workspace">
    <header class="top">
      <button class="icon-btn" id="fold" type="button" aria-label="Lipat sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M9 5v14"/></svg>
      </button>
      <form class="search" id="search-form" role="search">
        <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
        <input id="search" type="search" placeholder="Cari produk, pesanan, retur, promosi, menu..." aria-label="Cari produk, pesanan, retur, promosi, menu..." autocomplete="off">
        <kbd>⌘ K</kbd>
        <div class="results" id="results" hidden></div>
      </form>
      <div class="top-right">
        <button class="pill hide-sm" type="button" data-pop="zone">GMT+7</button>
        <button class="icon-btn hide-sm" type="button" data-pop="chat" aria-label="Buka Pesan &amp; Obrolan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 6h14v9H8l-3 3V6z"/></svg>
          <span class="count">2</span>
        </button>
        <button class="icon-btn" type="button" data-pop="notif" aria-label="Buka Notifikasi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M6 16V10a6 6 0 1 1 12 0v6l1.2 2H4.8L6 16z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
          <span class="count">9</span>
        </button>
        <button class="profile" type="button" data-pop="profile" aria-label="Pawpuff, Alief Rahman Daipaha, Owner">
          <span class="avatar" aria-hidden="true">A</span>
          <span class="who">
            <strong>Pawpuff</strong>
            <span>Alief Rahman Daipaha <em>•</em> <b>Owner</b></span>
          </span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
        </button>
      </div>
    </header>
    <div class="canvas" id="canvas"></div>
    <div class="pop" id="pop" hidden></div>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>
<script src="js/dashboard-preview.js?v=full2"></script>
</body>
</html>
